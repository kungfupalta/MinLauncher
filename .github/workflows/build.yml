name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q MinLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle -p MinLauncher :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MinLauncher-apk
          path: MinLauncher/app/build/outputs/apk/release/*.apk
